name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.10'}
          - {os: macos-latest, python: '3.13'}
          # ADVISORY, not blocking. The product is the macOS app; the Python
          # package's Windows port is a separate slice and is not done. What is
          # left is portability, not flakiness, and each piece is known:
          # `file_identity` matches directory entries by (st_dev, st_ino) and
          # Windows `scandir` reports st_ino as 0; a file another handle still
          # holds cannot be replaced or unlinked; denial text carries POSIX
          # paths; MAX_PATH; the .docx/.pdf renderers have no Windows path.
          # The jobs stay in the matrix so the number stays visible and is
          # watched — a silently dropped platform is one nobody ever fixes —
          # but a red Windows job does not hold up main.
          - {os: windows-latest, python: '3.10', advisory: true}
          - {os: windows-latest, python: '3.13', advisory: true}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: git config --global user.name CrossAudit-CI
      - run: git config --global user.email crossaudit-ci@local.invalid
      # git for Windows ships core.autocrlf=true. The suite creates its own
      # repositories, which inherit it, and the product hashes the bytes it
      # wrote and re-reads them out of the commit: a checkout filter that
      # rewrites line endings makes a receipt's constitution hash differ from
      # the tree it was derived from. Byte-exact receipts and an eol filter are
      # incompatible by construction, so the filter is off.
      - run: git config --global core.autocrlf false
      - run: git config --global core.longpaths true
      - run: python -m pip install --upgrade pip
      # The install is for the dependency set. The suite itself runs against
      # the SOURCE TREE (PYTHONPATH=src), because that is what it is written to
      # audit: guards locate product files through `crossaudit.__file__`, the
      # node/zh harnesses read `src/crossaudit/console/page.py`, and
      # `test_verifier_rederives_remaining.py::test_these_guards_ran_against_
      # the_tree_under_test` FAILS BY DESIGN unless the imported package is
      # this checkout. Run it off site-packages and ~90 guards report on a
      # tree nobody changed. The release gate runs it this way too.
      # The wheel is not left untested: the `package` job below builds one and
      # installs it in a fresh environment as its own self-test.
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q --timeout=30
        env:
          PYTHONPATH: src

  quality:
    env:
      PYTHONUTF8: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Reject syntax, undefined names, and invalid control flow
        run: python -m ruff check --select E9,F63,F7,F82 src tests
      - run: python -m compileall -q src tests
      - name: Measure branch coverage and enforce the baseline
        # Same reasoning as the test job: the suite reads the source tree.
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run -m pytest -q --timeout=30
          python -m coverage report

  package:
    env:
      PYTHONUTF8: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - name: Inspect and install the actual wheel in a fresh environment
        run: python packaging/verify_python_package.py dist/*.whl --expected-version "$(PYTHONPATH=src python -c 'import crossaudit;print(crossaudit.__version__)')"
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/*

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install .
      - name: Audit the installed runtime dependency graph
        run: |
          python -m pip freeze | grep -viE '^crossaudit([=@ ]|$)' > audit-requirements.txt
          python -m pip_audit --strict -r audit-requirements.txt
